$kind: http-request
description: |-
  Controller: AuthController::login()
  Contoh response tersimpan pada tab Examples.
url: "{{base_url}}/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "tidak_ada_xyz",
      "password": "RahasiaUji123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code 401', () => pm.response.to.have.status(401));
      pm.test('Response berformat JSON', () => pm.response.to.be.json);
      const j = pm.response.json();
      pm.test('success = false', () => pm.expect(j.success).to.eql(false));
      pm.test('Envelope lengkap (success, message, data, timestamp)', () => { ['success','message','data','timestamp'].forEach(k => pm.expect(j).to.have.property(k)); });
      pm.test('Pesan sesuai', () => pm.expect(j.message).to.eql("Username atau password salah"));
      pm.test('data = null', () => pm.expect(j.data).to.eql(null));
      pm.test('token tidak diberikan', () => pm.expect(pm.response.text()).to.not.include('eyJ'));
    language: text/javascript
examples: ./.resources/3. POST login - Username tidak terdaftar (401).resources/examples
order: 3000
