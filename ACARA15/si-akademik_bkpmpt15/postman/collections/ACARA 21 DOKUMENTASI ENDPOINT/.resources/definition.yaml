$kind: collection
description: 'Collection Acara 21 (Dokumentasi API), lanjutan Acara 20. Setiap request berisi Description (Controller::method) dan contoh response pada tab Examples. Pilih Environment "Local" (Apache/XAMPP), "Local (php -S 8080)" (jalankan.bat) atau "Staging". Jalankan lewat Runner dari atas ke bawah: folder Auth membuat akun uji, folder Login mengambil token (disimpan otomatis ke {{token}}), folder Proteksi Token menguji penolakan 401 (tanpa token, token diubah, token acak, skema bukan Bearer, token kedaluwarsa), lalu folder Mahasiswa memakai token tersebut pada POST/PUT/DELETE. Token berlaku 5 menit (Tugas Mandiri 2).'
