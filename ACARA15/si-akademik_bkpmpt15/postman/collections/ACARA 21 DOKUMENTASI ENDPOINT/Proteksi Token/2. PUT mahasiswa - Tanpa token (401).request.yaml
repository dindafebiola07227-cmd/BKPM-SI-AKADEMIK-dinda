$kind: http-request
description: |-
  Controller: MahasiswaController::update()
  Memerlukan header Authorization: Bearer <token> (Auth::requireAuth()).
  Contoh response tersimpan pada tab Examples.
url: "{{base_url}}/mahasiswa?id={{mhsId}}"
method: PUT
headers:
  Content-Type: application/json
queryParams:
  id: "{{mhsId}}"
body:
  type: json
  content: |-
    {
      "nim": "{{nimBaru}}",
      "nama": "Andi Saputra",
      "prodi": "Teknik Informatika"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code 401', () => pm.response.to.have.status(401));
      pm.test('Response berformat JSON', () => pm.response.to.be.json);
      const j = pm.response.json();
      pm.test('success = false', () => pm.expect(j.success).to.eql(false));
      pm.test('Envelope lengkap (success, message, data, timestamp)', () => { ['success','message','data','timestamp'].forEach(k => pm.expect(j).to.have.property(k)); });
      pm.test('Pesan sesuai', () => pm.expect(j.message).to.eql("Token tidak ditemukan"));
      pm.test('data = null', () => pm.expect(j.data).to.eql(null));
    language: text/javascript
examples: ./.resources/2. PUT mahasiswa - Tanpa token (401).resources/examples
order: 2000
