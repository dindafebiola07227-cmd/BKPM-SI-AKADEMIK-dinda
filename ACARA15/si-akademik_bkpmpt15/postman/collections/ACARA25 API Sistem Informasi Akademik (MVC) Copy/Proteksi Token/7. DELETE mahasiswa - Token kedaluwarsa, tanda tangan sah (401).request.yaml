$kind: http-request
description: |-
  Controller: MahasiswaController::destroy()
  Memerlukan header Authorization: Bearer <token> (Auth::requireAuth()).
  Contoh response tersimpan pada tab Examples.
url: "{{base_url}}/mahasiswa?id={{mhsId}}"
method: DELETE
headers:
  Authorization: Bearer {{tokenKedaluwarsa}}
queryParams:
  id: "{{mhsId}}"
scripts:
  - type: afterResponse
    code: |-
      // Token ini ditandatangani dengan SECRET yang benar, tetapi exp = 1700000000 (sudah lewat) -> ditolak karena kedaluwarsa, bukan karena signature.
      pm.test('Status code 401', () => pm.response.to.have.status(401));
      pm.test('Response berformat JSON', () => pm.response.to.be.json);
      const j = pm.response.json();
      pm.test('success = false', () => pm.expect(j.success).to.eql(false));
      pm.test('Envelope lengkap (success, message, data, timestamp)', () => { ['success','message','data','timestamp'].forEach(k => pm.expect(j).to.have.property(k)); });
      pm.test('Pesan sesuai', () => pm.expect(j.message).to.eql("Token tidak valid atau kedaluwarsa"));
      pm.test('data = null', () => pm.expect(j.data).to.eql(null));
    language: text/javascript
examples: ./.resources/7. DELETE mahasiswa - Token kedaluwarsa, tanda tangan sah (401).resources/examples
order: 7000
