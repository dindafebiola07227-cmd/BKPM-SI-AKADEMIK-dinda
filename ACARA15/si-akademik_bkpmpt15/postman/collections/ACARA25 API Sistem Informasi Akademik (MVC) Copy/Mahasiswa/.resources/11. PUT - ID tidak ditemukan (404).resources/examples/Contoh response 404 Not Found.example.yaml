$kind: http-example
request:
  url: "{{base_url}}/mahasiswa?id=999999"
  method: PUT
  headers:
    Content-Type: application/json
    Authorization: Bearer {{adminToken}}
  queryParams:
    id: "999999"
  body:
    type: json
    content: |-
      {
        "nim": "{{nimBaru}}",
        "nama": "Andi Saputra Pratama",
        "prodi": "Sistem Informasi"
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
          "success": false,
          "message": "Data tidak ditemukan",
          "data": null,
          "timestamp": "2026-11-01T00:30:05+07:00"
      }
order: 1000
