$kind: http-request
description: |-
  Controller: AuthController::login()
  Contoh response tersimpan pada tab Examples.
url: "{{base_url}}/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "{{unameBaru}}",
      "password": "RahasiaUji123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code 200', () => pm.response.to.have.status(200));
      pm.test('Response berformat JSON', () => pm.response.to.be.json);
      const j = pm.response.json();
      pm.test('success = true', () => pm.expect(j.success).to.eql(true));
      pm.test('Envelope lengkap (success, message, data, timestamp)', () => { ['success','message','data','timestamp'].forEach(k => pm.expect(j).to.have.property(k)); });
      pm.test('Pesan sesuai', () => pm.expect(j.message).to.eql("Login berhasil"));
      pm.test('data.token berupa JWT 3 bagian (header.payload.signature)', () => { pm.expect(j.data.token).to.be.a('string'); pm.expect(j.data.token.split('.')).to.have.lengthOf(3); });
      pm.test('role = user (hasil registrasi)', () => pm.expect(j.data.role).to.eql('user'));
      pm.test('expires_in = 300 detik (Tugas Mandiri 2)', () => pm.expect(j.data.expires_in).to.eql(300));
      pm.test('hash password tidak dikembalikan ke client', () => pm.expect(pm.response.text()).to.not.include('$2y$'));
      // Token disimpan agar dipakai request berikutnya lewat header Authorization: Bearer {{token}}
      pm.collectionVariables.set('token', j.data.token);
      // Token rusak (satu karakter terakhir diganti) untuk skenario token diubah
      const t = j.data.token; pm.collectionVariables.set('tokenRusak', t.slice(0, -1) + (t.slice(-1) === 'A' ? 'B' : 'A'));
    language: text/javascript
examples: ./.resources/1. POST login - Sukses, token disimpan (200).resources/examples
order: 1000
