$kind: http-request
description: Auth::requireAdmin()
url: "{{base_url}}/mahasiswa?id={{mhsId}}"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
queryParams:
  id: "{{mhsId}}"
body:
  type: json
  content: |-
    {
      "nim": "{{nimBaru}}",
      "nama": "Andi Saputra",
      "prodi": "Teknik Informatika"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code 403', () => pm.response.to.have.status(403));
      const j = pm.response.json();
      pm.test('success = false', () => pm.expect(j.success).to.eql(false));
      pm.test('Pesan akses ditolak', () => pm.expect(j.message).to.eql('Akses ditolak, hanya admin yang diizinkan'));
    language: text/javascript
order: 4000
