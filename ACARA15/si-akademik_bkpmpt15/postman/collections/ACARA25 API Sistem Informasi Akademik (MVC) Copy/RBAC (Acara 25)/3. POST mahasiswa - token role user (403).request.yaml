$kind: http-request
description: "Auth::requireAdmin(): token sah tetapi role user -> 403."
url: "{{base_url}}/mahasiswa"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
      "nim": "{{nimBaru}}",
      "nama": "Andi Saputra",
      "prodi": "Teknik Informatika"
    }
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('nimBaru', '22' + String(Date.now()).slice(-7));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status code 403', () => pm.response.to.have.status(403));
      const j = pm.response.json();
      pm.test('success = false', () => pm.expect(j.success).to.eql(false));
      pm.test('Pesan akses ditolak', () => pm.expect(j.message).to.eql('Akses ditolak, hanya admin yang diizinkan'));
    language: text/javascript
order: 3000
