$kind: http-request
url: "{{baseUrl}}/mahasiswa?id={{mhsId}}"
method: GET
queryParams:
  id: "{{mhsId}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code 200', () => pm.response.to.have.status(200));
      pm.test('Response berformat JSON', () => pm.response.to.be.json);
      const j = pm.response.json();
      pm.test('success = true', () => pm.expect(j.success).to.eql(true));
      pm.test('Envelope lengkap (success, message, data, timestamp)', () => { ['success','message','data','timestamp'].forEach(k => pm.expect(j).to.have.property(k)); });
      pm.test('timestamp berformat tanggal valid', () => pm.expect(new Date(j.timestamp).toString()).to.not.eql('Invalid Date'));
      pm.test('Pesan sesuai', () => pm.expect(j.message).to.eql("Data berhasil diambil"));
      pm.test('NIM sesuai', () => pm.expect(j.data.nim).to.eql(pm.collectionVariables.get('nimBaru')));
    language: text/javascript
order: 3000
