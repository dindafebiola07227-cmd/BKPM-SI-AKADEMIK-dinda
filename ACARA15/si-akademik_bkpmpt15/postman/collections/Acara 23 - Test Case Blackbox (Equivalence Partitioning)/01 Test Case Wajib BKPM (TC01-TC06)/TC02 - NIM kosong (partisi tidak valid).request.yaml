$kind: http-request
description: |-
  Data uji: nim=""
  Hasil diharapkan: 400 / 422
url: "{{base_url}}/mahasiswa"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: '{"nim": "", "nama": "Budi Santoso", "prodi": "Informatika"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("TC02: NIM kosong (partisi tidak valid) -> status 400 / 422", function () {
          pm.expect(pm.response.code).to.be.oneOf([400, 422]);
      });
    language: text/javascript
order: 2000
