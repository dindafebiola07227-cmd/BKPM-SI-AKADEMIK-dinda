$kind: http-request
description: |-
  Data uji: password salah
  Hasil diharapkan: 401
url: "{{base_url}}/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"username": "penguji", "password": "salah"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("TC05: Login kredensial salah -> status 401", function () {
          pm.expect(pm.response.code).to.be.oneOf([401]);
      });
    language: text/javascript
order: 5000
