$kind: http-request
url: "{{base_url}}/mahasiswa"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: '{"nim": "220100202", "nama": "Data Seed C", "prodi": "Informatika"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("Seed C dibuat (201)", function () { pm.response.to.have.status(201); });
      pm.collectionVariables.set("idC", pm.response.json().data.id);
    language: text/javascript
order: 5000
