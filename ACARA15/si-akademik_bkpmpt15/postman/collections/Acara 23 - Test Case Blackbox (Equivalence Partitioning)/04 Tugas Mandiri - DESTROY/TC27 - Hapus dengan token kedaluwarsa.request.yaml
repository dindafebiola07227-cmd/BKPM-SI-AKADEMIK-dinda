$kind: http-request
description: |-
  Data uji: id=ID-B, token exp lewat
  Hasil diharapkan: 401
url: "{{base_url}}/mahasiswa?id={{idB}}"
method: DELETE
headers:
  Content-Type: application/json
  Authorization: Bearer {{token_kedaluwarsa}}
queryParams:
  id: "{{idB}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("TC27: Hapus dengan token kedaluwarsa -> status 401", function () {
          pm.expect(pm.response.code).to.be.oneOf([401]);
      });
    language: text/javascript
order: 7000
