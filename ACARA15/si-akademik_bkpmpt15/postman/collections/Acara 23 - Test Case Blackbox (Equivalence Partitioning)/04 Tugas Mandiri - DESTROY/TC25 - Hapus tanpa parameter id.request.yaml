$kind: http-request
description: |-
  Data uji: tanpa id
  Hasil diharapkan: 400
url: "{{base_url}}/mahasiswa"
method: DELETE
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("TC25: Hapus tanpa parameter id -> status 400", function () {
          pm.expect(pm.response.code).to.be.oneOf([400]);
      });
    language: text/javascript
order: 5000
