$kind: http-request
name: TC21 - Hapus data valid (MahasiswaController::destroy)
description: |-
  Data uji: id=ID-C
  Hasil diharapkan: 200
url: "{{base_url}}/mahasiswa?id={{idC}}"
method: DELETE
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
queryParams:
  id: "{{idC}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("TC21: Hapus data valid (MahasiswaController::destroy) -> status 200", function () {
          pm.expect(pm.response.code).to.be.oneOf([200]);
      });
    language: text/javascript
order: 1000
