$kind: http-request
description: |-
  Data uji: id=ID-B, tanpa Authorization
  Hasil diharapkan: 401
url: "{{base_url}}/mahasiswa?id={{idB}}"
method: DELETE
headers:
  Content-Type: application/json
queryParams:
  id: "{{idB}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("TC26: Hapus tanpa token -> status 401", function () {
          pm.expect(pm.response.code).to.be.oneOf([401]);
      });
    language: text/javascript
order: 6000
