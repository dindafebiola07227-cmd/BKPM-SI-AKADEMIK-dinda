$kind: http-request
description: |-
  Data uji: id=ID-C (sudah terhapus)
  Hasil diharapkan: 404
url: "{{base_url}}/mahasiswa?id={{idC}}"
method: DELETE
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
queryParams:
  id: "{{idC}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("TC22: Hapus ulang ID yang sudah terhapus -> status 404", function () {
          pm.expect(pm.response.code).to.be.oneOf([404]);
      });
    language: text/javascript
order: 2000
