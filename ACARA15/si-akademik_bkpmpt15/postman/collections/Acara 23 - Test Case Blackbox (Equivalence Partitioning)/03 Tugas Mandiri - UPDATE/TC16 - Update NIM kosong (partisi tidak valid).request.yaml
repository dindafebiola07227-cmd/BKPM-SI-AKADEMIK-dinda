$kind: http-request
description: |-
  Data uji: id=ID-B, nim=""
  Hasil diharapkan: 400 / 422
url: "{{base_url}}/mahasiswa?id={{idB}}"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
queryParams:
  id: "{{idB}}"
body:
  type: text
  content: '{"nim": "", "nama": "Budi Santoso", "prodi": "Informatika"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("TC16: Update NIM kosong (partisi tidak valid) -> status 400 / 422", function () {
          pm.expect(pm.response.code).to.be.oneOf([400, 422]);
      });
    language: text/javascript
order: 5000
