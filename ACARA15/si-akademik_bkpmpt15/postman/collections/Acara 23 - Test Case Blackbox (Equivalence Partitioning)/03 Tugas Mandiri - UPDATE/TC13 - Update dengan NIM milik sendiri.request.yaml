$kind: http-request
description: |-
  Data uji: id=ID-A, nim=220100210
  Hasil diharapkan: 200
url: "{{base_url}}/mahasiswa?id={{idA}}"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
queryParams:
  id: "{{idA}}"
body:
  type: text
  content: '{"nim": "220100210", "nama": "Seed A Revisi", "prodi": "Sistem Informasi"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("TC13: Update dengan NIM milik sendiri -> status 200", function () {
          pm.expect(pm.response.code).to.be.oneOf([200]);
      });
    language: text/javascript
order: 2000
