$kind: http-request
description: |-
  Data uji: id=ID-B, nim=ABCDEFGHI
  Hasil diharapkan: 422
url: "{{base_url}}/mahasiswa?id={{idB}}"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
queryParams:
  id: "{{idB}}"
body:
  type: text
  content: '{"nim": "ABCDEFGHI", "nama": "Budi Santoso", "prodi": "Informatika"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("TC18: Update NIM berisi huruf -> status 422", function () {
          pm.expect(pm.response.code).to.be.oneOf([422]);
      });
    language: text/javascript
order: 7000
