$kind: http-request
description: |-
  Data uji: id=999999
  Hasil diharapkan: 404
url: "{{base_url}}/mahasiswa?id=999999"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
queryParams:
  id: "999999"
body:
  type: text
  content: '{"nim": "220100300", "nama": "Budi Santoso", "prodi": "Informatika"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("TC14: Update ID tidak ada di database -> status 404", function () {
          pm.expect(pm.response.code).to.be.oneOf([404]);
      });
    language: text/javascript
order: 3000
