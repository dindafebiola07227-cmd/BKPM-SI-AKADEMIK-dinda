$kind: http-request
url: "{{baseUrl}}/api/mahasiswa/abc"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code 400", function () { pm.response.to.have.status(400); });
      pm.test("Response berformat JSON", function () { pm.response.to.be.json; });
      pm.test("success = false", function () { pm.expect(pm.response.json().success).to.eql(false); });
    language: text/javascript
order: 2000
