$kind: http-request
url: "{{baseUrl}}/api/mahasiswa/9999"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "nim": "2401099",
        "nama": "Tidak Ada",
        "email": "x@gmail.com"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code 404", function () { pm.response.to.have.status(404); });
      pm.test("Response berformat JSON", function () { pm.response.to.be.json; });
      pm.test("success = false", function () { pm.expect(pm.response.json().success).to.eql(false); });
    language: text/javascript
order: 8000
