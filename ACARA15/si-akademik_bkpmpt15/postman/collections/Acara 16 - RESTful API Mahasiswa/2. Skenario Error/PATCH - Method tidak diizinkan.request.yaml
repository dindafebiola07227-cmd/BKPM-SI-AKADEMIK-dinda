$kind: http-request
url: "{{baseUrl}}/api/mahasiswa/1"
method: PATCH
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "nama": "x"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code 405", function () { pm.response.to.have.status(405); });
      pm.test("Response berformat JSON", function () { pm.response.to.be.json; });
      pm.test("success = false", function () { pm.expect(pm.response.json().success).to.eql(false); });
    language: text/javascript
order: 12000
