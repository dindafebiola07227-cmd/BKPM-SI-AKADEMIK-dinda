$kind: http-request
url: "{{baseUrl}}/api/mahasiswa"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "nim": "2401001",
        "nama": "Duplikat",
        "email": "dup@gmail.com"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code 409", function () { pm.response.to.have.status(409); });
      pm.test("Response berformat JSON", function () { pm.response.to.be.json; });
      pm.test("success = false", function () { pm.expect(pm.response.json().success).to.eql(false); });
    language: text/javascript
order: 7000
