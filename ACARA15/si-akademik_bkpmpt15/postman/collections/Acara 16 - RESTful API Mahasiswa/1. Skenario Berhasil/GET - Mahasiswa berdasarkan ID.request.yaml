$kind: http-request
url: "{{baseUrl}}/api/mahasiswa/1"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code 200", function () { pm.response.to.have.status(200); });
      pm.test("Response berformat JSON", function () { pm.response.to.be.json; });
      pm.test("success = true", function () { pm.expect(pm.response.json().success).to.eql(true); });
    language: text/javascript
order: 2000
