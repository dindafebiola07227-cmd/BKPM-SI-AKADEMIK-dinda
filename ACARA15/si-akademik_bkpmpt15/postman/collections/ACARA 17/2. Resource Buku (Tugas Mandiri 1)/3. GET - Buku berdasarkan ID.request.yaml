$kind: http-request
url: "{{baseUrl}}/buku?id={{bukuId}}"
method: GET
queryParams:
  id: "{{bukuId}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code 200', () => pm.response.to.have.status(200));
      pm.test('Response berformat JSON', () => pm.response.to.be.json);
      const j = pm.response.json();
      pm.test('success = true', () => pm.expect(j.success).to.eql(true));
      pm.test('judul sesuai', () => pm.expect(j.data.judul).to.eql('Pemrograman Web dengan PHP'));
    language: text/javascript
order: 3000
