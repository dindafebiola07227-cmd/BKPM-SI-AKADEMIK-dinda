$kind: http-example
request:
  url: "{{base_url}}/mahasiswa"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "nim": "{{nimBaru}}",
        "nama": "Andi Saputra",
        "prodi": "Teknik Informatika"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
          "success": false,
          "message": "Token tidak ditemukan",
          "data": null,
          "timestamp": "2026-11-18T19:00:35+07:00"
      }
order: 1000
