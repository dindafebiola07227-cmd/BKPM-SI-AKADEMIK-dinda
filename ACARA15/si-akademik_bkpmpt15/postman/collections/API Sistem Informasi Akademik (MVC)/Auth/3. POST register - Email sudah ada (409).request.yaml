$kind: http-request
description: |-
  Controller: AuthController::register()
  Contoh response tersimpan pada tab Examples.
url: "{{base_url}}/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "baru_{{unameBaru}}",
      "email": "{{emailBaru}}",
      "password": "RahasiaUji123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code 409', () => pm.response.to.have.status(409));
      pm.test('Response berformat JSON', () => pm.response.to.be.json);
      const j = pm.response.json();
      pm.test('success = false', () => pm.expect(j.success).to.eql(false));
      pm.test('Envelope lengkap (success, message, data, timestamp)', () => { ['success','message','data','timestamp'].forEach(k => pm.expect(j).to.have.property(k)); });
      pm.test('Pesan sesuai', () => pm.expect(j.message).to.eql("Email sudah terdaftar"));
      pm.test('errors berisi daftar pesan per field', () => { pm.expect(j.errors).to.be.an('object'); pm.expect(j.errors.email).to.be.an('array'); });
    language: text/javascript
examples: ./.resources/3. POST register - Email sudah ada (409).resources/examples
order: 3000
