$kind: http-request
url: "{{base_url}}/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: "{}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code 400', () => pm.response.to.have.status(400));
      pm.test('Response berformat JSON', () => pm.response.to.be.json);
      const j = pm.response.json();
      pm.test('success = false', () => pm.expect(j.success).to.eql(false));
      pm.test('Envelope lengkap (success, message, data, timestamp)', () => { ['success','message','data','timestamp'].forEach(k => pm.expect(j).to.have.property(k)); });
      pm.test('Pesan sesuai', () => pm.expect(j.message).to.eql("Username, email, dan password wajib diisi"));
      pm.test('errors berisi daftar pesan per field', () => { pm.expect(j.errors).to.be.an('object'); pm.expect(j.errors.username).to.be.an('array'); pm.expect(j.errors.email).to.be.an('array'); pm.expect(j.errors.password).to.be.an('array'); });
    language: text/javascript
examples: ./.resources/4. POST register - Body kosong {} (400).resources/examples
order: 4000
