$kind: http-request
url: "{{base_url}}/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "{{unameBaru}}",
      "email": "lain.{{emailBaru}}",
      "password": "RahasiaUji123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code 409', () => pm.response.to.have.status(409));
      pm.test('Response berformat JSON', () => pm.response.to.be.json);
      const j = pm.response.json();
      pm.test('success = false', () => pm.expect(j.success).to.eql(false));
      pm.test('Envelope lengkap (success, message, data, timestamp)', () => { ['success','message','data','timestamp'].forEach(k => pm.expect(j).to.have.property(k)); });
      pm.test('Pesan sesuai', () => pm.expect(j.message).to.eql("Username sudah terdaftar"));
      pm.test('errors berisi daftar pesan per field', () => { pm.expect(j.errors).to.be.an('object'); pm.expect(j.errors.username).to.be.an('array'); });
    language: text/javascript
examples: ./.resources/2. POST register - Username sudah ada (409).resources/examples
order: 2000
