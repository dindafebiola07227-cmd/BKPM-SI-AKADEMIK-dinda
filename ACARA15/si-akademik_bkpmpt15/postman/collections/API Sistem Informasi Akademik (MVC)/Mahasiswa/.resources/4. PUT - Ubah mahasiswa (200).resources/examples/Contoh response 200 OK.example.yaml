$kind: http-example
request:
  url: "{{base_url}}/mahasiswa?id={{mhsId}}"
  method: PUT
  headers:
    Content-Type: application/json
    Authorization: Bearer {{token}}
  queryParams:
    id: "{{mhsId}}"
  body:
    type: json
    content: |-
      {
        "nim": "{{nimBaru}}",
        "nama": "Andi Saputra Pratama",
        "prodi": "Sistem Informasi"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
          "success": true,
          "message": "Data berhasil diperbarui",
          "data": {
              "id": 1,
              "nim": "227805357",
              "nama": "Andi Saputra Pratama",
              "prodi": "Sistem Informasi",
              "created_at": "2026-10-31 17:30:05"
          },
          "timestamp": "2026-11-01T00:30:05+07:00"
      }
order: 1000
