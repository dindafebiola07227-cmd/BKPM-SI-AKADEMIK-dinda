$kind: http-request
description: |-
  Controller: AuthController::login()
  Contoh response tersimpan pada tab Examples.
url: "{{base_url}}/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: "{}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code 400', () => pm.response.to.have.status(400));
      pm.test('Response berformat JSON', () => pm.response.to.be.json);
      const j = pm.response.json();
      pm.test('success = false', () => pm.expect(j.success).to.eql(false));
      pm.test('Envelope lengkap (success, message, data, timestamp)', () => { ['success','message','data','timestamp'].forEach(k => pm.expect(j).to.have.property(k)); });
      pm.test('Pesan sesuai', () => pm.expect(j.message).to.eql("Username dan password wajib diisi"));
      pm.test('data = null', () => pm.expect(j.data).to.eql(null));
      pm.test('errors memuat field: username, password', () => { pm.expect(j.errors).to.have.property('username'); pm.expect(j.errors).to.have.property('password'); });
    language: text/javascript
examples: ./.resources/4. POST login - Body kosong {} (400).resources/examples
order: 4000
