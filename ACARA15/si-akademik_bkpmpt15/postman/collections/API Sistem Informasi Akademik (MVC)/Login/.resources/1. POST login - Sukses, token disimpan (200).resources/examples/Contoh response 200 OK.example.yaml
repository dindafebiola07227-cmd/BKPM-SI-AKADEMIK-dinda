$kind: http-example
request:
  url: "{{base_url}}/login"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "username": "{{unameBaru}}",
        "password": "RahasiaUji123"
      }
