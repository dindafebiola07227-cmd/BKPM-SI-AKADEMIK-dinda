$kind: http-request
url: "{{base_url}}/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "uji_email_salah",
      "email": "bukan-email",
      "password": "RahasiaUji123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code 422', () => pm.response.to.have.status(422));
      pm.test('Response berformat JSON', () => pm.response.to.be.json);
      const j = pm.response.json();
      pm.test('success = false', () => pm.expect(j.success).to.eql(false));
      pm.test('Envelope lengkap (success, message, data, timestamp)', () => { ['success','message','data','timestamp'].forEach(k => pm.expect(j).to.have.property(k)); });
      pm.test('Pesan sesuai', () => pm.expect(j.message).to.eql("Format email tidak valid"));
      pm.test('errors berisi daftar pesan per field', () => { pm.expect(j.errors).to.be.an('object'); pm.expect(j.errors.email).to.be.an('array'); });
    language: text/javascript
examples: ./.resources/6. POST register - Format email tidak valid (422).resources/examples
order: 6000
