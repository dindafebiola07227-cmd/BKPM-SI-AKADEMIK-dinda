$kind: http-example
request:
  url: "{{base_url}}/register"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "username": "{{unameBaru}}",
        "email": "{{emailBaru}}",
        "password": "RahasiaUji123"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
          "success": true,
          "message": "Registrasi berhasil",
          "data": {
              "id": 1
          },
          "timestamp": "2026-11-01T00:30:04+07:00"
      }
order: 1000
