$kind: http-example
request:
  url: "{{base_url}}/mahasiswa"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "nim": "{{nimBaru}}",
        "nama": "Andi Saputra Pratama",
        "prodi": "Sistem Informasi"
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
          "success": false,
          "message": "NIM sudah terdaftar",
          "data": null,
          "errors": {
              "nim": [
                  "NIM sudah terdaftar"
              ]
          },
          "timestamp": "2026-11-01T00:30:05+07:00"
      }
order: 1000
