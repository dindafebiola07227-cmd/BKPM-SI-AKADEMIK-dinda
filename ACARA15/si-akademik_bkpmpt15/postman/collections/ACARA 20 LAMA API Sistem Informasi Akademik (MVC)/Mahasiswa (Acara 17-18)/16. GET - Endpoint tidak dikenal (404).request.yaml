$kind: http-request
url: "{{base_url}}/produk"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code 404', () => pm.response.to.have.status(404));
      pm.test('Response berformat JSON', () => pm.response.to.be.json);
      const j = pm.response.json();
      pm.test('success = false', () => pm.expect(j.success).to.eql(false));
      pm.test('Envelope lengkap (success, message, data, timestamp)', () => { ['success','message','data','timestamp'].forEach(k => pm.expect(j).to.have.property(k)); });
      pm.test('Pesan sesuai', () => pm.expect(j.message).to.eql("Endpoint tidak ditemukan"));
    language: text/javascript
examples: ./.resources/16. GET - Endpoint tidak dikenal (404).resources/examples
order: 16000
