<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Data Mahasiswa - Sistem Informasi Akademik</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; margin: 2rem auto; max-width: 860px; padding: 0 1rem; color: #222; }
    h1 { font-size: 1.4rem; margin-bottom: .25rem; }
    p.sub { margin-top: 0; color: #555; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { border: 1px solid #bbb; padding: .5rem .75rem; text-align: left; }
    thead th { background: #e8eef7; }
    tbody tr:nth-child(even) { background: #f7f7f7; }
    td.pesan { text-align: center; color: #555; font-style: italic; }
  </style>
</head>
<body>
  <h1>Data Mahasiswa</h1>
  <p class="sub">Sistem Informasi Akademik &ndash; data diambil dari API (GET /mahasiswa)</p>

  <table id="tabel-mahasiswa">
    <thead><tr><th>NIM</th><th>Nama</th><th>Program Studi</th></tr></thead>
    <tbody>
      <tr><td colspan="3" class="pesan">Memuat data...</td></tr>
    </tbody>
  </table>

  <script src="app.js"></script>
</body>
</html>
