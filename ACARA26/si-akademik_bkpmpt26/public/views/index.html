<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Data Mahasiswa - Sistem Informasi Akademik</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 32px; color: #222; }
        h1 { font-size: 22px; }
        table { border-collapse: collapse; width: 100%; max-width: 720px; }
        th, td { border: 1px solid #ccc; padding: 8px 12px; text-align: left; }
        th { background: #1f4e79; color: #fff; }
        tbody tr:nth-child(even) { background: #f3f6fa; }
        #status { margin: 12px 0; font-style: italic; color: #555; }
        #status.error { color: #b00020; font-style: normal; }
    </style>
</head>
<body>
    <h1>Daftar Mahasiswa</h1>
    <!-- Tugas mandiri 1 & 2: indikator "Memuat data..." dan pesan "Belum ada data" -->
    <p id="status">Memuat data...</p>

    <table id="tabel-mahasiswa">
        <thead><tr><th>NIM</th><th>Nama</th><th>Program Studi</th></tr></thead>
        <tbody></tbody>
    </table>

    <script src="app.js"></script>
</body>
</html>
